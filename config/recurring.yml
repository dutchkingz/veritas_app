# Recurring jobs — Google Gemini (paid tier, 30 req/min cap)
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every day at 2am

  fetch_articles:
    class: FetchArticlesJob
    queue: default
    schedule: every 2 hours

  periodic_reassessment:
    class: GenerateIntelligenceBriefJob
    queue: intelligence
    args: ["periodic"]
    schedule: every 3 hours

  generate_narrative_routes:
    class: GenerateNarrativeRoutesJob
    queue: default
    args: [{ limit: 50 }]
    schedule: every 2 hours at minute 15

  regional_analysis_refresh:
    class: ScheduleRegionalAnalysisJob
    queue: default
    schedule: every 6 hours at minute 30

  cluster_narrative_signatures:
    class: NarrativeSignatureClusterJob
    queue: intelligence
    schedule: every 4 hours at minute 45

  detect_contradictions:
    class: DetectContradictionsJob
    queue: intelligence
    schedule: every 6 hours

  generate_daily_brief:
    class: GenerateIntelligenceBriefJob
    queue: intelligence
    args: ["daily"]
    schedule: every day at 6am

  capture_embedding_snapshot:
    class: CaptureEmbeddingSnapshotJob
    queue: intelligence
    schedule: every 12 hours

  fetch_gdelt_articles:
    class: FetchGdeltArticlesJob
    queue: default
    schedule: every 2 hours

  fetch_gdelt_events:
    class: FetchGdeltEventsJob
    queue: default
    schedule: every 4 hours at minute 30

  prune_api_usage_logs:
    command: "ApiUsageLog.where('created_at < ?', 30.days.ago).delete_all"
    schedule: every day at 3am

development:
  fetch_articles:
    class: FetchArticlesJob
    queue: default
    schedule: every 30 minutes

  fetch_gdelt_articles:
    class: FetchGdeltArticlesJob
    queue: default
    schedule: every hour

  fetch_gdelt_events:
    class: FetchGdeltEventsJob
    queue: default
    schedule: every 2 hours at minute 30

  prune_api_usage_logs:
    command: "ApiUsageLog.where('created_at < ?', 30.days.ago).delete_all"
    schedule: every day at 3am
